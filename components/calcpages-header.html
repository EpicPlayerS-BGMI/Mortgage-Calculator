<div
  class="mx-auto flex h-16 w-full max-w-7xl items-center justify-between gap-4 px-4"
>
  <a
    href="/"
    class="group flex min-w-0 items-center gap-3"
    aria-label="CalcBase Home"
  >
    <span
      class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
    </span>
    <div class="min-w-0">
      <p
        class="truncate text-lg font-extrabold tracking-tight text-slate-900 dark:text-white"
      >
        CalcBase
      </p>
      <p
        class="hidden truncate text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400 sm:block"
      >
        Financial Calculators
      </p>
    </div>
  </a>

  <nav
    aria-label="Primary navigation"
    class="hidden items-center gap-1 md:flex"
  >
    <a
      data-nav-link
      href="/"
      class="rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-indigo-600 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-400"
      >Home</a
    >

    <div class="relative" data-dropdown="calculators">
      <button
        id="desktop-calculators-trigger"
        type="button"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="desktop-calculators-menu"
        class="inline-flex items-center gap-1 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-indigo-600 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-400"
      >
        Calculators
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          aria-hidden="true"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <div
        id="desktop-calculators-menu"
        role="menu"
        aria-label="Calculator categories"
        class="invisible pointer-events-none absolute left-0 top-full z-60 w-72 rounded-xl border border-slate-200 bg-white p-2 opacity-0 shadow-xl transition duration-150 dark:border-slate-700 dark:bg-slate-900"
      >
        <a
          role="menuitem"
          href="/mortgage-calculator/"
          class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >Mortgage Calculator</a
        >
        <a
          role="menuitem"
          href="/personal-loan-calculator/"
          class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >Personal Loan Calculator</a
        >
        <a
          role="menuitem"
          href="/car-loan-calculator/"
          class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >Car Loan Calculator</a
        >
        <a
          role="menuitem"
          href="/sip-calculator/"
          class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >SIP Calculator</a
        >
        <a
          role="menuitem"
          href="/fd-calculator/"
          class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >FD Calculator</a
        >
        <a
          role="menuitem"
          href="/inflation-calculator/"
          class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >Inflation Calculator</a
        >
      </div>
    </div>
    <a
      data-nav-link
      href="/blogs/"
      class="rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-indigo-600 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-400"
      >Blogs</a
    >

    <a
      data-nav-link
      href="/about/"
      class="rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-indigo-600 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-400"
      >About</a
    >
    <a
      data-nav-link
      href="/contact/"
      class="rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-indigo-600 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-400"
      >Contact</a
    >
  </nav>

  <div class="flex items-center gap-2">
    <label for="header-currency" class="sr-only">Select currency</label>
    <select
      id="header-currency"
      aria-label="Select currency"
      class="hidden rounded-xl border border-slate-300 bg-white pl-3 pr-9 py-2 text-xs font-semibold text-slate-700 outline-none transition hover:border-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:border-slate-600 dark:focus:ring-indigo-900 sm:block"
    >
      <option value="USD">USD</option>
      <option value="GBP">GBP</option>
      <option value="INR">INR</option>
    </select>

    <button
      onclick="toggleTheme()"
      id="theme-toggle"
      type="button"
      aria-label="Toggle dark mode"
      class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-100 transition hover:bg-indigo-100 active:scale-95 dark:bg-slate-800 dark:hover:bg-indigo-900/40"
    >
      <span id="theme-icon-light" class="hidden text-lg" aria-hidden="true"
        >☀️</span
      >
      <span id="theme-icon-dark" class="text-lg" aria-hidden="true">🌙</span>
    </button>

    <button
      id="hamMenu"
      type="button"
      aria-label="Open mobile navigation"
      aria-controls="mobileMenu"
      aria-expanded="false"
      class="rounded-lg p-2 transition hover:bg-slate-100 dark:hover:bg-slate-800 md:hidden"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          d="M3 6h18M3 12h18M3 18h18"
        />
      </svg>
    </button>
  </div>
</div>

<div
  id="mobileOverlay"
  class="fixed inset-0 z-40 hidden bg-black/40 md:hidden"
  onclick="closeMobileMenu()"
></div>

<aside
  id="mobileMenu"
  class="fixed left-0 top-0 z-50 h-full w-80 max-w-[85vw] -translate-x-full border-r border-slate-200 bg-white px-4 py-3 transition-transform duration-300 dark:border-slate-700 dark:bg-slate-900 md:hidden"
  aria-label="Mobile menu"
>
  <div
    class="flex items-center justify-between border-b border-slate-200 px-2 py-3 dark:border-slate-700"
  >
    <p class="text-base font-bold text-slate-900 dark:text-white">Navigation</p>
    <button
      onclick="closeMobileMenu()"
      type="button"
      aria-label="Close mobile navigation"
      class="rounded-md p-1.5 text-slate-500 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
    >
      ✕
    </button>
  </div>

  <nav
    aria-label="Mobile primary navigation"
    class="mt-4 flex flex-col gap-1 px-1"
  >
    <a
      data-nav-link
      href="/"
      class="rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100 hover:text-indigo-600 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
      >Home</a
    >
    <details
      class="group rounded-lg border border-slate-200 p-1 dark:border-slate-700"
    >
      <summary
        class="flex cursor-pointer list-none items-center justify-between rounded-md px-2 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800"
      >
        <span>Calculators</span>
        <span class="transition group-open:rotate-180">⌄</span>
      </summary>
      <div class="mt-1 flex flex-col gap-1 pb-1 pl-2">
        <a
          href="/mortgage-calculator/"
          class="rounded-md px-2 py-2 text-sm text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >Mortgage</a
        >
        <a
          href="/personal-loan-calculator/"
          class="rounded-md px-2 py-2 text-sm text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >Personal Loan</a
        >
        <a
          href="/car-loan-calculator/"
          class="rounded-md px-2 py-2 text-sm text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >Car Loan</a
        >
        <a
          href="/sip-calculator/"
          class="rounded-md px-2 py-2 text-sm text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >SIP</a
        >
        <a
          href="/fd-calculator/"
          class="rounded-md px-2 py-2 text-sm text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >FD</a
        >
        <a
          href="/inflation-calculator/"
          class="rounded-md px-2 py-2 text-sm text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
          >Inflation</a
        >
      </div>
    </details>
    <a
      data-nav-link
      href="/blogs/"
      class="rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100 hover:text-indigo-600 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
      >Blogs</a
    >
    <a
      data-nav-link
      href="/about/"
      class="rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100 hover:text-indigo-600 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
      >About</a
    >
    <a
      data-nav-link
      href="/contact/"
      class="rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100 hover:text-indigo-600 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-indigo-300"
      >Contact</a
    >
  </nav>

  <div class="mt-5 border-t border-slate-200 px-2 pt-4 dark:border-slate-700">
    <label
      for="header-currency-mobile"
      class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400"
      >Currency</label
    >
    <select
      id="header-currency-mobile"
      aria-label="Select currency on mobile"
      class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm font-medium text-slate-700 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:focus:ring-indigo-900"
    >
      <option value="USD">USD - US Dollar</option>
      <option value="GBP">GBP - British Pound</option>
      <option value="INR">INR - Indian Rupee</option>
    </select>
  </div>
</aside>
