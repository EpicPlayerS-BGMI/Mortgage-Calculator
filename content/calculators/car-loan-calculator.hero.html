<!-- Currency Selector -->
      <div class="flex justify-end max-w-7xl mx-auto mb-6">
        <div
          class="flex bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl border border-slate-200/50 dark:border-slate-700/50"
        >
          <button
            onclick="setCurrency('USD')"
            id="btn-usd"
            class="px-5 py-2 text-xs font-bold rounded-lg bg-white dark:bg-indigo-600 text-indigo-500 dark:text-white shadow-sm transition active:scale-[0.95]"
          >
            USD ($)
          </button>
          <button
            onclick="setCurrency('GBP')"
            id="btn-gbp"
            class="px-5 py-2 text-xs font-bold rounded-lg text-slate-500 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition"
          >
            GBP (£)
          </button>
          <button
            onclick="setCurrency('INR')"
            id="btn-inr"
            class="px-5 py-2 text-xs font-bold rounded-lg text-slate-500 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition"
          >
            INR (₹)
          </button>
        </div>
      </div>

      <section class="text-center max-w-3xl mx-auto mb-14">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4">
          Car Loan
          <span class="text-indigo-600 dark:text-indigo-400"
            >EMI Calculator</span
          >
        </h1>
        <p class="text-lg text-slate-600 dark:text-slate-400">
          Plan your new or used car purchase. Calculate monthly EMIs, total
          interest, and loan cost instantly.
        </p>
      </section>
